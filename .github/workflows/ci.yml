name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.90.0"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    name: Verify declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-msrv@0.19.3
      - run: cargo msrv verify -- cargo check --locked --all-targets --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --all-features --workspace --locked

  release-regression:
    name: Release tooling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    name: Release
    needs: [rust, msrv, coverage, release-regression]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Publish release
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Explain missing publication credentials
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo '::notice::Registry publishing is skipped until CARGO_REGISTRY_TOKEN is configured. Other checks and the fallback build still run.'
      - name: Build release or fallback version
        run: |
          if grep -Fxq 'version = "0.0.0"' Cargo.toml; then
            node scripts/prepare-release.mjs "0.0.${GITHUB_RUN_ID}"
          fi
          cargo build --release --locked
